<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 106 106">
  <!-- StarShape (primary tone) with its hard offset shadow -->
  <style>
    .ink { fill: #1a1a1a; stroke: #1a1a1a; }
    .star { fill: #ff6b35; stroke: #1a1a1a; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #fff4e0; stroke: #fff4e0; }
